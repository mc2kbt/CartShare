<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CartShare - Collaborative Shopping</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Link to your CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Login / Room Entry View -->
    <div class="container mt-5 pt-5" id="login-view">
        <div class="card card-custom p-5 mx-auto" style="max-width: 450px;">
            <h2 class="text-center text-primary mb-4"><i class="fa-solid fa-cart-shopping me-2"></i>CartShare</h2>
            <form id="login-form">
                <div class="mb-3"><input type="text" id="username" class="form-control form-control-lg" placeholder="Your Name" required></div>
                <div class="mb-4"><input type="text" id="room" class="form-control form-control-lg text-uppercase" placeholder="Room Code (e.g., DORM1)" required></div>
                <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold">Enter Room</button>
            </form>
        </div>
    </div>

    <!-- Main App View -->
    <div id="app-view" style="display: none;">
        <nav class="navbar navbar-dark bg-dark sticky-top no-print">
            <div class="container">
                <a class="navbar-brand fw-bold" href="#"><i class="fa-solid fa-cart-shopping me-2"></i>CartShare</a>
                <div class="text-white">
                    <span class="me-3"><i class="fa-solid fa-users me-1"></i> Room: <strong id="display-room" class="text-info"></strong></span>
                    <button class="btn btn-sm btn-outline-light" onclick="location.reload()">Leave</button>
                </div>
            </div>
        </nav>

        <header class="hero-banner text-center mb-5 no-print">
            <div class="container">
                <h2 class="display-6 fw-bold">Collaborative Group Shopping</h2>
                <p class="lead">Add items below. Everything syncs instantly with your roommates!</p>
            </div>
        </header>

        <main class="container py-3">
            <div class="row g-4">
                <!-- Left Column (Catalog & Cart) -->
                <div class="col-lg-8">
                    <h4 class="text-primary mb-3 no-print">Quick Catalog</h4>
                    <div class="row g-3 mb-4 no-print" id="catalog-list"></div>

                    <div class="card card-custom p-4">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h4 class="fw-bold mb-0"><i class="fa-solid fa-basket-shopping me-2"></i>Shared Cart</h4>
                            <button class="btn btn-dark btn-sm no-print" onclick="window.print()"><i class="fa-solid fa-print me-1"></i> Print Receipt</button>
                        </div>

                        <div class="mb-4 no-print">
                            <div class="d-flex justify-content-between text-muted small mb-1">
                                <span>Free Delivery Goal ($75.00)</span><span id="total-cost-text">$0.00</span>
                            </div>
                            <div class="progress" style="height: 8px;"><div id="delivery-progress" class="progress-bar bg-primary" style="width: 0%"></div></div>
                        </div>

                        <ul class="list-group list-group-flush mb-3" id="cart-container"></ul>
                        <div class="border-top pt-3 d-flex justify-content-between align-items-center">
                            <span class="fw-bold h5">Grand Total:</span><span id="final-total" class="fw-bold h5 text-primary">$0.00</span>
                        </div>
                    </div>
                </div>

                <!-- Right Column (Splits & Logs) -->
                <div class="col-lg-4 no-print">
                    <div class="card card-custom p-4 mb-4">
                        <h5 class="fw-bold border-bottom pb-2"><i class="fa-solid fa-money-bill-transfer me-2"></i>Cost Split</h5>
                        <ul class="list-group list-group-flush" id="split-list"></ul>
                    </div>
                    <div class="card card-custom p-4">
                        <h5 class="fw-bold border-bottom pb-2"><i class="fa-solid fa-clock-rotate-left me-2"></i>Activity Log</h5>
                        <div id="log-list" class="overflow-auto" style="max-height: 250px;"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Bootstrap JS and Your Logic JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
